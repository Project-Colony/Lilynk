  - gamestream
  - streaming
  - remote-play
ReleaseNotesUrl: https://github.com/Project-Colony/Lilynk/blob/main/docs/upstream/releases/v0.19.2.md
InstallationNotes: |-
  Console de gestion web :  https://<ce-PC>:47992
    Cette installation a généré un mot de passe de connexion sans l’afficher. Affichez-le depuis
    un PowerShell EN TANT QU’ADMINISTRATEUR, AVANT votre première connexion :   lilynk-host web password
    La console ne conserve ensuite qu’un hachage salé dans %ProgramData%\lilynk\web-password, donc un
    mot de passe oublié se réinitialise : remettez une ligne LILYNK_UI_PASSWORD=<votre-mot-de-passe> dans ce
    fichier et exécutez  lilynk-host service restart

  Configuration :  %ProgramData%\lilynk\host.env
  Journaux :       %ProgramData%\lilynk\logs\

  Le service de l’hôte démarre automatiquement avec le système. `lilynk-host` est dans le PATH de la machine — exécutez
  `lilynk-host service status` depuis une invite de commandes en tant qu’administrateur pour le vérifier.
