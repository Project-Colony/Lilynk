ShortDescription: Game-Streaming-Host mit geringer Latenz — streamt die Spiele deines PCs an jeden Lilynk- oder Moonlight-Client.
Description: |-
  Lilynk Host macht einen Windows-11-PC zum Game-Streaming-Server mit geringer Latenz. Er erfasst
  den Desktop oder eine eigene virtuelle Anzeige, kodiert mit NVENC / AMF / QSV / Vulkan und
  streamt über sein eigenes QUIC-Protokoll an Lilynk-Clients unter Windows, macOS, iOS, tvOS,
  Android und Linux — oder per GameStream an unveränderte Moonlight-Clients.

  Der Installer bringt den virtuellen Anzeigetreiber ly-vdisplay mit (Streaming in nativer Auflösung
  und mit HDR ohne physischen Monitor), virtuelle Gamepads (DualSense, DualShock 4, Xbox 360) und
  eine Web-Konsole zur Verwaltung auf Port 47992.
Tags:
  - game-streaming
  - remote-desktop
  - moonlight
  - gamestream
  - streaming
  - remote-play
ReleaseNotesUrl: https://github.com/Project-Colony/Lilynk/blob/main/docs/upstream/releases/v0.19.2.md
InstallationNotes: |-
  Web-Konsole zur Verwaltung:  https://<dieser-PC>:47992
    Diese Installation hat ein Anmeldepasswort erzeugt und nicht angezeigt. Gib es VOR deiner
    ersten Anmeldung in einer PowerShell MIT ADMINISTRATORRECHTEN aus:
      lilynk-host web password
    Danach behält die Konsole nur einen gesalzenen Hash in %ProgramData%\lilynk\web-password.
    Ein vergessenes Passwort setzt du zurück: Schreib wieder eine Zeile
    LILYNK_UI_PASSWORD=<dein-passwort> in diese Datei und führe danach aus:
      lilynk-host service restart

  Konfiguration:  %ProgramData%\lilynk\host.env
  Logs:           %ProgramData%\lilynk\logs\

  Der Host-Dienst startet automatisch beim Hochfahren. `lilynk-host` liegt im PATH des Rechners.
  Mit `lilynk-host service status` prüfst du ihn in einer Eingabeaufforderung als Administrator.
