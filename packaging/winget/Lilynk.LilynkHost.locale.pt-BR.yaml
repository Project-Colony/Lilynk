ShortDescription: Host de streaming de jogos de baixa latência — transmita os jogos do seu PC para qualquer cliente Lilynk ou Moonlight.
Description: |-
  O Lilynk Host transforma um PC com Windows 11 em um servidor de streaming de jogos de baixa latência. Ele captura
  a área de trabalho ou uma tela virtual dedicada, codifica com NVENC / AMF / QSV / Vulkan e transmite pelo seu
  protocolo QUIC nativo para clientes Lilynk no Windows, macOS, iOS, tvOS, Android e Linux — ou pelo
  GameStream para clientes Moonlight padrão.

  O instalador inclui o driver de tela virtual ly-vdisplay (streaming em resolução nativa e em HDR sem um monitor
  físico), controles virtuais DualSense / DualShock 4 / Xbox 360 e um console web de gerenciamento disponibilizado
  na porta 47992.
Tags:
  - game-streaming
  - remote-desktop
  - moonlight
  - gamestream
  - streaming
  - remote-play
ReleaseNotesUrl: https://github.com/Project-Colony/Lilynk/blob/main/docs/upstream/releases/v0.19.2.md
InstallationNotes: |-
  Console web de gerenciamento:  https://<este-PC>:47992
    Esta instalação gerou uma senha de login e não a exibiu. Exiba-a em um
    PowerShell como ADMINISTRADOR, ANTES do seu primeiro login:   lilynk-host web password
    Depois disso, o console guarda apenas um hash com salt em %ProgramData%\lilynk\web-password; assim, uma
    senha esquecida é redefinida desta forma: coloque de volta uma linha LILYNK_UI_PASSWORD=<sua-senha> nesse
    arquivo e execute  lilynk-host service restart

  Configuração:   %ProgramData%\lilynk\host.env
  Logs:           %ProgramData%\lilynk\logs\

  O serviço do host inicia automaticamente com o sistema. O `lilynk-host` está no PATH da máquina — execute
  `lilynk-host service status` em um prompt como administrador para verificar.
