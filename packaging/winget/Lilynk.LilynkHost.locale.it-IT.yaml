ShortDescription: Host di streaming di giochi a bassa latenza — trasmetti i giochi del tuo PC a qualsiasi client Lilynk o Moonlight.
Description: |-
  Lilynk Host trasforma un PC con Windows 11 in un server di streaming di giochi a bassa latenza. Cattura il
  desktop o uno schermo virtuale dedicato, codifica con NVENC / AMF / QSV / Vulkan e trasmette tramite il
  proprio protocollo QUIC nativo ai client Lilynk su Windows, macOS, iOS, tvOS, Android e Linux —
  oppure tramite GameStream ai client Moonlight standard.

  Il programma di installazione include il driver per schermo virtuale ly-vdisplay (streaming alla risoluzione nativa e in HDR
  senza un monitor fisico), controller virtuali DualSense / DualShock 4 / Xbox 360 e una console web di gestione
  disponibile sulla porta 47992.
Tags:
  - game-streaming
  - remote-desktop
  - moonlight
  - gamestream
  - streaming
  - remote-play
ReleaseNotesUrl: https://github.com/Project-Colony/Lilynk/blob/main/docs/upstream/releases/v0.19.2.md
InstallationNotes: |-
  Console web di gestione:  https://<this-PC>:47992
    Questa installazione ha generato una password di accesso e non l’ha mostrata. Visualizzala da una
    PowerShell COME AMMINISTRATORE, PRIMA del primo accesso:   lilynk-host web password
    La console conserva poi solo un hash con salt in %ProgramData%\lilynk\web-password, quindi una
    password dimenticata si reimposta così: rimetti una riga LILYNK_UI_PASSWORD=<your-password> in quel
    file ed esegui  lilynk-host service restart

  Configurazione:  %ProgramData%\lilynk\host.env
  Log:             %ProgramData%\lilynk\logs\

  Il servizio host parte automaticamente con il sistema. `lilynk-host` è nel PATH di sistema — esegui
  `lilynk-host service status` da un prompt dei comandi come amministratore per controllarlo.
