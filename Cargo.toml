[workspace]
resolver = "2"
members = [
    # crates/<group>: core and codec serve both sides; client and host never depend on each
    # other; install sits on core and host. scripts/ci/check-crate-groups.py holds the rule.
    "crates/core/lilynk-core",
    "crates/core/ly-dmabuf",
    "crates/core/ly-update-check",
    "crates/core/ly-fluent",
    "crates/codec/ly-bitstream",
    "crates/codec/ly-bitstream/vendor/cros-codecs",
    "crates/codec/ly-vkdecode",
    "crates/codec/ly-vaapi",
    "crates/codec/ly-libva",
    "crates/codec/ly-v4l2",
    "crates/codec/ly-v4l2dec",
    "crates/codec/ly-dxvadec",
    "crates/codec/pyrowave-sys",
    "crates/codec/libvpl-sys",
    "crates/client/lilynk-ffi",
    "crates/client/ly-client-core",
    "crates/client/ly-client-video",
    "crates/client/ly-presenter",
    "crates/client/ly-console-ui",
    "crates/host/lilynk-host",
    # The capability-carrying PyroWave encode worker. A SEPARATE binary by design — never a
    # hardlink of, or a subcommand of, lilynk-host (design/gpu-priority-capability-worker.md).
    "crates/host/lilynk-encode-worker",
    # The Windows capture worker: Windows Graphics Capture and the encoder, as the signed-in
    # user. A separate binary by design (design/windows-wgc-capture.md §4.2).
    "crates/host/lilynk-capture-worker",
    "crates/host/ly-capture",
    "crates/host/ly-encode",
    "crates/host/ly-encode-core",
    "crates/host/ly-encode-win",
    "crates/host/ly-encode-session",
    "crates/host/ly-vdisplay",
    "crates/host/ly-inject",
    "crates/host/ly-inject/vendor/usbip-sim",
    "crates/host/ly-audio",
    "crates/host/ly-clipboard",
    "crates/host/ly-frame",
    "crates/host/ly-gpu",
    "crates/host/ly-zerocopy",
    "crates/host/ly-portal",
    "crates/host/ly-win-display",
    "crates/host/ly-driver-proto",
    "crates/host/ly-host-config",
    "crates/host/ly-paths",
    "crates/host/ly-paths-win",
    "crates/host/ly-seats",
    "crates/host/ly-seat-audio",
    # The seat supervisor's binary, apart from its library: it links ly-inject for the pads it
    # builds, which the Windows seat keeper's own workspace cannot resolve beside IronRDP.
    "crates/host/lilynk-seats",
    "crates/install/lilynk-setup",
    # The Windows installer wizard (WinUI 3 over the same engine). Stub bin off-Windows.
    "crates/install/lilynk-setup-win",
    "crates/install/lilynk-tray",
    "crates/install/ly-update",
    "clients/probe",
    "clients/cli",
    "clients/linux",
    "clients/session",
    "clients/windows",
    "clients/android/native",
    "clients/apple/native",
    "tools/cursor-probe",
    "tools/display-disturb",
    "tools/gen-headers",
    "tools/loss-harness",
    "tools/scroll-probe",
    "tools/wgc-probe",
    "tools/wl-scanout-probe",
    # Every message a person reads, and the crate that compiles them (l10n/README.md).
    "l10n",
]
# Standalone PoC (built on its own; pulls usbip/tokio/libusb we don't want in the workspace).
# The vendored `ndk` is a [patch.crates-io] source, not a member: it only compiles for the
# `*-linux-android` targets, so workspace membership would break host `cargo build --workspace`.
exclude = [
    "packaging/linux/steam-deck-gadget/usbip-poc",
    "clients/android/native/vendor/ndk",
    # Bring-your-own-hardware measurement tools. `hid-descriptor-dump` pulls `hidapi`, a C library
    # wanting libudev on Linux; `win-input-matrix` is Windows-only and asks the live input stacks
    # what they can see. Neither belongs in `cargo build --workspace` or on a CI leg with no pad.
    "tools/hid-descriptor-dump",
    "tools/win-input-matrix",
    # A Windows-only design spike: its ring states are the design it tested, not the shipped au
    # ring's, so it builds on its own and no CI leg compiles it.
    "tools/fence-ring-spike",
    # libFuzzer targets: nightly and `cargo fuzz` only, run weekly by audit.yml.
    "fuzz",
]

# ndk 0.9.0 with a small maintained patch set: public `MediaCodec::as_ptr` (frame-rendered
# callback) and `AudioStreamBuilder::as_ptr` (channel mask), two warning fixes, and panic-free
# destructors for fallible NDK cleanup. The pointer patches can disappear when upstream exposes
# those bindings; destructor failures remain non-actionable in `Drop` and must never unwind
# through a JNI or codec callback boundary.
[patch.crates-io]
ndk = { path = "clients/android/native/vendor/ndk" }

[workspace.package]
version = "0.47.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["unom"]
repository = "https://git.unom.io/unom/punktfunk"

# Pins every member must share. A member adds `optional` and its own features on top; cargo
# unions them with the entry's.
[workspace.dependencies]
# The TLS stack runs on aws-lc-rs. rustls, quinn, rcgen and ureq each pick a backend on their own
# and default to ring, so each entry turns defaults off and names aws-lc-rs. quinn's list is its
# default set with `rustls-ring` swapped out; ureq takes `rustls-no-provider` because its `rustls`
# feature pulls ring. `prefer-post-quantum` leads with the X25519MLKEM768 hybrid; ring has no
# ML-KEM. `prebuilt-nasm` keeps aws-lc-sys building on Windows without NASM.
aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"] }
quinn = { version = "0.11", default-features = false, features = [
    "log",
    "platform-verifier",
    "runtime-tokio",
    "rustls-aws-lc-rs",
    "bloom",
] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

# microsoft/windows-rs at verified commits: crates.io's windows-reactor (0.100.0) lacks the
# ComponentCompletion and ComponentTimer the Windows client uses. Re-run lilynk-setup-win's
# tests/wizard_flow.rs on every reactor bump. Host crates declare crates.io `windows = "0.62"`
# inline: cargo can't rename a workspace entry per member.
#
# Two revs on purpose. Past 58217a690 `windows` projects Win32 with pointer + count for a slice
# and out-params for return values, which the D3D11 decode path would have to follow. No
# `windows` COM object reaches reactor, so the two need no common `windows-core`.
windows = { git = "https://github.com/microsoft/windows-rs", rev = "58217a690" }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "d19f6bbc0" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "d19f6bbc0" }

windows-sys = "0.61"

# One generation owns every Vulkan handle, including the ones sdl3's `ash` feature types.
ash = "0.38"
# The vendored parser snapshot the decode crates share.
cros-codecs = { path = "crates/codec/ly-bitstream/vendor/cros-codecs" }

# The `unsafe` discipline the `packaging/windows/drivers/*` crates also run, extended to the
# workspace. `unsafe fn` marks a CONTRACT the caller must uphold; it is not a licence for the whole
# body to skip checking. Without this lint an `unsafe fn` body is unchecked end to end, so a 600-line
# function hides which handful of lines are actually the unsafe ones. (It is the Rust 2024 default;
# `deny` pins it explicitly.)
#
# `deny`, not `warn`: CI runs `cargo clippy … -D warnings`, which promotes a warning to a hard
# error anyway, so the level states what CI does.
#
# THE EXEMPTIONS. Ten GPU/FFI backend files (eight under `ly-encode/src/enc/linux`, two under
# `ly-encode-win/src/windows`) carry `#![allow(unsafe_op_in_unsafe_fn)]` with a short reason
# each. They are where this lint stops paying: their bodies are ash/CUDA/NVENC/D3D11/pyrowave-sys
# calls almost line for line. Narrowing them means one `unsafe {}` per line plus, since the lint
# below is denied, one hand-written SAFETY comment per line that could only ever restate "an ash
# call on a live device".
#
# Everything else in the workspace is at zero and enforced. Removing one of those allows, file by
# file, is real work with a real payoff; blanket-narrowing all of them is not. Prefer DELETING an
# `unsafe fn` marker over wrapping its body: keep the marker only where a caller can actually break
# something (a raw pointer, a borrowed HANDLE, a GPU object that must not be in flight).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# The PS5 homebrew target (punktfunk/client-ps5) is a custom target JSON whose vendor rustc does
# not list: `all(target_os = "freebsd", target_vendor = "sie")` gates it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("sie"))'] }

# The companion lint: every `unsafe {}` / `unsafe impl` carries a `// SAFETY:` proof. It lives here
# so a NEW crate (or a new module in an old one) is covered on creation rather than on
# remembering. NOTE: this table reaches only crates with `[lints] workspace = true`;
# `packaging/windows/drivers` and `packaging/windows/ly-vkhdr-layer` are SEPARATE workspaces and
# restate it (any "workspace-wide" claim must be made three times or it is false). Of the members,
# only the two vendored snapshots (ly-bitstream/vendor/cros-codecs, ly-inject/vendor/usbip-sim)
# stay out, deliberately — upstream code stays pristine.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# `*const T as *mut T` reads like any other cast. `cast_mut()` names the one that can turn a
# shared borrow into a write, so a grep finds every site.
ptr_cast_constness = "deny"
# `SAFETY:` on safe code reads as a proof and proves nothing.
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
# Warn, which CI's `-D warnings` denies: a mapped view or an OS buffer is aligned by a rule the
# compiler cannot see, and each such cast says which in an `#[expect(.., reason)]`.
cast_ptr_alignment = "warn"

# PROVENANCE has no lint and no sanitizer, so the rule lives here. A pointer into a C flexible
# array is taken from the whole struct with `&raw const (*detail).DevicePath`, never from the
# `[T; 1]` field's `as_ptr()`: that pointer may reach one element, and the callee reads the rest.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# NOTE: deliberately NOT `panic = "abort"`. lilynk-ffi ships as a cdylib/staticlib into
# third-party apps (Swift/Kotlin/C) and its C ABI catches panics at the boundary
# (`catch_unwind` → `PunktfunkStatus::Panic`). `panic = "abort"` would make that guard a
# no-op and let a stray panic abort the embedding application. Unwinding keeps the
# documented isolation guarantee real.

# Canary CI raises codegen-units for workspace crates (scripts/ci/ly-version.sh). Dependencies
# stay at 1, so their sccache entries are the ones a release tag build reuses.
[profile.release.package."*"]
codegen-units = 1

# CI test builds: release code without LTO, so each test exe links fast. Its own target subdir,
# so a test run never replaces the release binaries a later step packs.
[profile.ci-test]
inherits = "release"
lto = false
codegen-units = 16

# The per-frame hot path must stay fast even in dev builds.
[profile.dev.package."*"]
opt-level = 2
