# The capability-carrying encode worker (design/gpu-priority-capability-worker.md): PyroWave
# sessions, and the zero-copy import/convert worker for NVENC captures.
#
# 🛑 This is a SEPARATE BINARY on purpose, and it must stay one. It is the only Lilynk file that
# may carry `cap_sys_nice=ep`; `lilynk-host` carries no capability on any channel, ever, because
# a capped process cannot be identified by KWin (`cap_ptrace_access_check` refuses
# `/proc/<pid>/exe` to a reader whose effective set is not a superset of the target's PERMITTED
# set) and therefore never gets `zkde_screencast_unstable_v1`, so every KDE desktop session
# fails. A hardlink to the host, or a hidden host subcommand, shares the inode and so shares the
# capability: same failure, silently. Never do either.
#
# All the logic lives in `ly-encode::worker` and `ly-zerocopy::worker`; this crate is the file,
# not the code.
[package]
name = "lilynk-encode-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "lilynk encode worker: owns the priority-elevated Vulkan devices (PyroWave, NVENC convert) so the host never carries a capability."
publish = false

[[bin]]
name = "lilynk-encode-worker"
path = "src/main.rs"

[dependencies]
# `features = ["pyrowave"]` unconditionally rather than through a feature of this crate: packaging
# builds this with `cargo build -p lilynk-encode-worker` and default features, and a worker
# built without the codec would be a binary that hands every session straight back to the
# in-process fallback while still carrying the capability. (No extra cost to the workspace:
# lilynk-host already has `default = ["pyrowave"]`, so a workspace build resolves it anyway.)
ly-encode = { path = "../ly-encode", features = ["pyrowave"] }
ly-zerocopy = { path = "../ly-zerocopy" }
# The scheduling boost both arms take; already linked through ly-encode.
ly-frame = { path = "../ly-frame" }
tracing = "0.1"
# The worker's stderr is inherited from the host that spawned it, so its lines land in the same
# journal — but it is a fresh process with no subscriber of its own, and without one the
# device-pick and priority-ladder lines would go nowhere.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
