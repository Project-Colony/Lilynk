# GPU vendor/adapter detection + selection + the live-session record, extracted into a leaf crate so
# every subsystem crate (ly-encode, ly-capture, ly-vdisplay) can consult the selected GPU WITHOUT
# depending on the orchestrator (plan §W6). Self-contained: reads config + writes the pref store.
[package]
name = "ly-gpu"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "punktfunk host GPU vendor/adapter enumeration, selection preference, and active-session accounting."
publish = false

[dependencies]
ly-host-config = { path = "../ly-host-config" }
ly-paths = { path = "../ly-paths" }
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
