# One Windows encode session: frames from a frame source through an encoder backend into the
# host's AU section. The ly-vdisplay driver links it under its swap chain and the capture worker
# under Windows Graphics Capture, so the loop, its back-pressure and its pacing exist once
# (design/windows-wgc-capture.md §4.5). Path dependency of BOTH workspaces, like ly-encode-win.
[package]
name = "ly-encode-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "punktfunk Windows encode session: pool slot to encoder to AU section, shared by the display driver and the capture worker."
publish = false

[target.'cfg(target_os = "windows")'.dependencies]
# The backends the open ladder walks, and the converters the targets run.
ly-encode-win = { path = "../ly-encode-win" }
ly-frame = { path = "../ly-frame" }
# `SET_ENCODE`, the AU section layout and the slot policy the loop publishes by.
ly-driver-proto = { path = "../ly-driver-proto" }
anyhow = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `SetEncodeReply` is Pod; pinned to ly-driver-proto's so the graph resolves one bytemuck.
bytemuck = "1.19"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# The loop's tests drive `ly_encode_core::fake::FakeEncoder` in place of a GPU backend.
ly-encode-core = { path = "../ly-encode-core", features = ["test-support"] }

[features]
default = []
# One per x86-64-only backend; each side turns on what its target can link.
nvenc = ["ly-encode-win/nvenc"]
qsv = ["ly-encode-win/qsv"]
pyrowave = ["ly-encode-win/pyrowave"]

[lints]
workspace = true
