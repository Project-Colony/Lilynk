# Host config-dir + owner-private file helpers, a leaf crate so the subsystem crates
# (ly-vdisplay, ly-capture) and the orchestrator can share them without depending on the
# `gamestream` module (plan §W6). Std + tracing; on Windows, ly-paths-win's ACL calls.
[package]
name = "ly-paths"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "Host config-directory resolution + owner-private file/dir creation (0600/0700 or SYSTEM/Admins DACL)."
publish = false

[dependencies]
tracing = "0.1"

# The one-call admin-only lock and the owner reads `create_private_dir` needs.
[target.'cfg(windows)'.dependencies]
ly-paths-win = { path = "../ly-paths-win" }

[lints]
workspace = true
