# The shared media-pipeline vocabulary (plan §W6): the captured-frame types and pixel formats that
# both capture (producer) and encode (consumer) speak, plus the small pure helpers that ride the
# same seam — HDR static metadata, the capture-stall classifier and its recovery ladder, the
# metronomic-stall detector, stream pacing, per-thread scheduling QoS, and (Windows) the DXGI
# capture identity + D3D11 device creation. A leaf so ly-capture and ly-encode can depend on the
# vocabulary WITHOUT depending on each other.
[package]
name = "ly-frame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "punktfunk host shared frame/format vocabulary: CapturedFrame, PixelFormat, HDR metadata, thread QoS, and the Windows DXGI capture identity."
publish = false

[dependencies]
anyhow = "1"
tracing = "0.1"
# `HdrMeta` is Pod; pinned to ly-driver-proto's so the graph resolves one bytemuck.
bytemuck = { version = "1.19", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `FramePayload::Cuda` owns a zero-copy `DeviceBuffer`; `libc` for the per-thread `setpriority`.
ly-zerocopy = { path = "../ly-zerocopy" }
libc = "0.2"
# The rtkit fallback in `thread_qos` (one blocking system-bus call per thread `setpriority`
# refuses). Same zbus the host already pulls via ashpd; `tokio` mirrors ashpd's backend choice
# so this adds the `blocking-api` surface without changing the resolved I/O backend, and no
# default `async-io`.
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The DXGI capture identity (`WinCaptureTarget`/`D3d11Frame`/`pack_luid`/`make_device`) + the GPU
# scheduling-priority hardening `make_device` applies, and the thread-QoS `SetThreadPriority`.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[lints]
workspace = true
