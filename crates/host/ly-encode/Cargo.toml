# Hardware/software video encode: the per-vendor backends (NVENC, VAAPI, AMF, QSV, Vulkan-Video,
# PyroWave, openh264) behind one `Encoder` trait + `open_video` selector. Speaks ly-frame
# (CapturedFrame/PixelFormat/dxgi identity) and ly-zerocopy (CUDA), never ly-capture — the
# capture→encode edge is one-way.
[package]
name = "ly-encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "punktfunk host video encode: NVENC/VAAPI/AMF/QSV/Vulkan-Video/PyroWave/openh264 backends behind one Encoder trait."
publish = false

[dependencies]
# `quic::{HdrMeta, resolve_codec, Welcome, CODEC_*}` and `video_fit` live outside the `quic`
# feature, so the encoder crate never builds quinn, rustls or opus.
lilynk-core = { path = "../../core/lilynk-core", default-features = false }
ly-frame = { path = "../ly-frame" }
# The `Encoder` contract and what every backend shares; re-exported wholesale from `lib.rs`.
ly-encode-core = { path = "../ly-encode-core" }
ly-gpu = { path = "../ly-gpu" }
ly-host-config = { path = "../ly-host-config" }
ly-zerocopy = { path = "../ly-zerocopy" }
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
# A test writer for the VAAPI and Windows live tests (`with_test_writer().try_init()`).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Shared test drivers: the PyroWave window walk and decoder, the trait-forwarding guard.
ly-encode-core = { path = "../ly-encode-core", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The encode-worker protocol tests measure what an AU costs as a serde_json body — the reason the
# access units ride a memfd instead (enc/linux/worker.rs).
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# The native VAAPI encoder (enc/linux/vaapi_native.rs): the libva session and its pure half.
ly-libva = { path = "../../codec/ly-libva" }
ly-vaapi = { path = "../../codec/ly-vaapi" }
# The `lilynk-encode-worker` protocol (enc/linux/worker.rs). The framing is ly-zerocopy's
# `ipc`, which is generic over the serde body; the message enums live here and version separately.
serde = { version = "1", features = ["derive"] }
# Software H.264 (openh264, BSD-2) — the GPU-less encode path. Linux only: on Windows the
# ly-vdisplay driver encodes, and it needs a render adapter to exist at all.
openh264 = "0.9"
libc = "0.2"
# `memfd_create` without a raw-fd adoption.
rustix = { version = "1", features = ["fs"] }
# Vulkan bindings for the raw Vulkan-Video encode + PyroWave compute backends (feature-gated
# below) and for `vk_util`, which every Linux build compiles.
ash = { workspace = true }
# `libnvidia-encode.so.1` is dlopen'd at runtime for the direct-SDK NVENC/CUDA backend.
libloading = "0.9"
# Direct-SDK NVENC (raw `sys::nvEncodeAPI` types; entry points resolved at runtime). `ci-check` =
# vendored bindings, no CUDA toolkit at build.
nvidia-video-codec-sdk = { version = "0.4", features = ["ci-check"], optional = true }
# PyroWave (opt-in wired-LAN wavelet codec) — vendored codec + bindgen'd C API, only under `pyrowave`.
pyrowave-sys = { path = "../../codec/pyrowave-sys", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# The native NVENC/AMF/QSV/Media Foundation/PyroWave backends and their SDK bindings; re-exported
# wholesale from `lib.rs`.
ly-encode-win = { path = "../ly-encode-win" }
# The live tests' adapter walk.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[features]
default = []
# NVENC hardware encode (Linux CUDA + Windows D3D11); entry points resolved at runtime.
nvenc = ["dep:nvidia-video-codec-sdk", "ly-encode-core/nvenc", "ly-encode-win/nvenc"]
# Raw Vulkan-Video HEVC/AV1 encode on Linux (reuses the `ash` bindings; no new dep).
vulkan-encode = ["ly-encode-core/vulkan-encode"]
# PyroWave — the opt-in wired-LAN intra-only wavelet codec (Linux encode backend).
pyrowave = ["dep:pyrowave-sys", "ly-encode-core/pyrowave", "ly-encode-win/pyrowave"]
# Native Intel QSV via the statically linked VPL dispatcher (Windows; runtime GPU
# libs come from the Intel driver store; design/native-qsv-encoder.md). ⚠ Like `nvenc`: hand
# builds need this feature or an Intel box has no QSV path.
qsv = ["ly-encode-win/qsv"]

[lints]
workspace = true
