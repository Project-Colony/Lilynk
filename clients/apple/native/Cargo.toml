[package]
name = "lilynk-client-apple"
description = "lilynk Apple client's static library: the lilynk C ABI plus the Skia console on Metal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# `liblilynk_apple.a` — scripts/build-xcframework.sh ships it as LilynkCore.xcframework's
# library. It links lilynk-ffi whole, so the `lilynk_*` C ABI is in it unchanged.
name = "lilynk_apple"
crate-type = ["staticlib"]

[dependencies]
lilynk-ffi = { path = "../../../crates/client/lilynk-ffi", features = ["quic"] }

# The console: the shell every other client shows, drawn through Skia's Metal backend into a
# texture Swift hands over (`src/console.rs`). `metal` + `ganesh` + `textlayout` = the prebuilt key
# `ganesh-jpegd-jpege-metal-pdf-textlayout`; build-xcframework.sh fetches and SHA-verifies each slice's.
[target.'cfg(target_vendor = "apple")'.dependencies]
ly-console-ui = { path = "../../../crates/client/ly-console-ui", default-features = false, features = [
    "metal",
] }
ly-client-core = { path = "../../../crates/client/ly-client-core", default-features = false }
# The unlock the console's password prompt hands to the app's dial.
lilynk-core = { path = "../../../crates/core/lilynk-core" }
# `lilynk_console_set_languages`: the language for text read with no console.
ly-l10n = { path = "../../../l10n" }
skia-safe = { version = "0.153", features = ["metal", "ganesh", "textlayout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shell logs through `tracing`; with no subscriber, its `log` feature forwards each event
# to the `log` backend `lilynk_set_log_callback` installs, which hands it to Swift.
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }

# `en-XA`, the pseudo-language the tests read the palette names in.
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
ly-l10n = { path = "../../../l10n", features = ["pseudo"] }

[lints]
workspace = true
