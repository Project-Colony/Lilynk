# Shown on the "new issue" chooser so security reports go to the private channel, not a public issue.
blank_issues_enabled: true
contact_links:
  - name: Report a bug or suggest an idea
    url: https://github.com/Project-Colony/Lilynk/issues
    about: >-
      Bugs and ideas are reported and followed in the GitHub issue tracker.
  - name: Report a security vulnerability
    url: https://github.com/Project-Colony/Lilynk/security/advisories/new
    about: >-
      Report a security issue privately through the advisory form, not in a public issue, so other
      users aren't exposed before a fix ships. See SECURITY.md for the policy.
